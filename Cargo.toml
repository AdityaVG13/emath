[workspace]
resolver = "2"
members = [
  "crates/emath-core",
  "crates/emath-source",
  "crates/emath-syntax",
  "crates/emath-ir",
  "crates/emath-goal",
  "crates/emath-plan",
  "crates/emath-sema",
  "crates/emath-exec-ir",
  "crates/emath-adapter-dew",
  "crates/emath-hir",
  "crates/emath-rust-ir",
  "crates/emath-rust-backend",
  "crates/emath-artifact",
  "crates/emath-runtime",
  "crates/emath-provider-api",
  "crates/emath-build",
  "crates/emath-builder",
  "crates/emath-macro",
  "crates/emath-lab-core",
  "crates/emath-checker",
  "crates/emath-evidence",
  "crates/emath-hir",
  "crates/emath-schema",
  "crates/emath-adapter-dew",
  "crates/emath-cli",
  "crates/emath-term",
  "crates/emath-world-ir",
  "crates/emath-tuning",
  "crates/emath-agent-protocol",
  "crates/emath-calibration",
  "crates/emath-law-check",
  "crates/emath-holes",
  "crates/emath-genesis",
  "crates/emath-meaning-provider-api",
  "crates/emath-portfolio",
  "crates/emath-world-codegen-rust",
  "crates/emath-adapter-rumoca",
  "examples/demo-host",
  "examples/demo-host-independent",
  "examples/provider-skeleton",
  "examples/generated/semantic-genesis-worlds",
  "xtask",
]
exclude = ["bootstrap", "implementation/rust-next", "artifacts"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.74"

[workspace.dependencies]
emath-core = { path = "crates/emath-core" }
emath-source = { path = "crates/emath-source" }
emath-syntax = { path = "crates/emath-syntax" }
emath-ir = { path = "crates/emath-ir" }
emath-goal = { path = "crates/emath-goal" }
emath-plan = { path = "crates/emath-plan" }
emath-sema = { path = "crates/emath-sema" }
emath-exec-ir = { path = "crates/emath-exec-ir" }
emath-rust-ir = { path = "crates/emath-rust-ir" }
emath-rust-backend = { path = "crates/emath-rust-backend" }
emath-artifact = { path = "crates/emath-artifact" }
emath-runtime = { path = "crates/emath-runtime" }
emath-provider-api = { path = "crates/emath-provider-api" }
emath-build = { path = "crates/emath-build" }
emath-builder = { path = "crates/emath-builder" }
emath-macro = { path = "crates/emath-macro" }
emath-lab-core = { path = "crates/emath-lab-core" }
emath-checker = { path = "crates/emath-checker" }
emath-evidence = { path = "crates/emath-evidence" }
emath-hir = { path = "crates/emath-hir" }
emath-schema = { path = "crates/emath-schema" }
emath-adapter-dew = { path = "crates/emath-adapter-dew" }
emath-cli = { path = "crates/emath-cli" }
emath-term = { path = "crates/emath-term" }
emath-world-ir = { path = "crates/emath-world-ir" }
emath-tuning = { path = "crates/emath-tuning" }
emath-agent-protocol = { path = "crates/emath-agent-protocol" }
emath-calibration = { path = "crates/emath-calibration" }
emath-law-check = { path = "crates/emath-law-check" }
emath-holes = { path = "crates/emath-holes" }
emath-genesis = { path = "crates/emath-genesis" }
emath-meaning-provider-api = { path = "crates/emath-meaning-provider-api" }
emath-portfolio = { path = "crates/emath-portfolio" }
emath-world-codegen-rust = { path = "crates/emath-world-codegen-rust" }
emath-adapter-rumoca = { path = "crates/emath-adapter-rumoca" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
