[package]
name = "emath-cli"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "emath"
path = "src/main.rs"

[dependencies]
emath-term.workspace = true
emath-core.workspace = true
emath-artifact = { workspace = true }
emath-build = { workspace = true }
emath-lab-core = { workspace = true }
emath-exec-ir = { workspace = true }
emath-rust-backend = { workspace = true }
emath-ir = { workspace = true }
emath-provider-api = { workspace = true }
emath-sema = { workspace = true }
emath-syntax = { workspace = true }
# Research-loop sessions: `emath loop` opens an authored session surface
# (Step/Seed pair) and drives it through the emath-tui host + REPL.
emath-tui = { workspace = true, features = ["dashboard"] }

[lints]
workspace = true
