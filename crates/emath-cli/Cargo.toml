[package]
name = "emath-cli"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "emath"
path = "src/main.rs"

[features]
# Gates the async runtime dependency. Optional by design: the default build
# stays std-only; this feature exposes the lab runtime entry (lsp::lab).
async-runtime = ["dep:asupersync"]

[dependencies]
emath-term.workspace = true
emath-genesis.workspace = true
emath-core.workspace = true
asupersync = { workspace = true, optional = true, features = ["test-internals"] }
emath-adapter-rumoca = { workspace = true }
emath-artifact = { workspace = true }
emath-build = { workspace = true }
emath-lab-core = { workspace = true }
emath-evidence = { workspace = true }
emath-exec-ir = { workspace = true }
emath-goal = { workspace = true }
# This dependency is deliberate: it carries real domain data, not thin type
# imports. It provides Goal (used in plan and agent JSON rendering),
# Provenance, FallbackPolicy, and EvidenceLevel. Re-expressing Goal in
# another crate would relocate ownership, not remove the need; emath-ir is
# the owner of these types.
emath-ir = { workspace = true }
emath-plan = { workspace = true }
emath-provider-api = { workspace = true }
emath-rust-backend = { workspace = true }
emath-sema = { workspace = true }
emath-syntax = { workspace = true }
emath-store = { path = "../emath-store" }
emath-world-ir = { workspace = true }

[lints]
workspace = true
