[package]
name = "emath-cli"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "emath"
path = "src/main.rs"

[features]
# Async-runtime lane for the tokio → asupersync cutover (pass 2), inherited
# from the absorbed emath-lsp crate. Optional by design: the default build
# stays std-only; this gate exposes the Cx/lab runtime entry (lsp::lab).
async-runtime = ["dep:asupersync"]

[dependencies]
emath-term.workspace = true
emath-genesis.workspace = true
emath-core.workspace = true
asupersync = { workspace = true, optional = true, features = ["test-internals"] }
emath-adapter-rumoca = { workspace = true }
emath-artifact = { workspace = true }
emath-build = { workspace = true }
emath-lab-core = { workspace = true }
emath-evidence = { workspace = true }
emath-exec-ir = { workspace = true }
emath-goal = { workspace = true }
# KEEP (rpme/C016/C060/C080, ledger card in bead close): this edge carries
# REAL domain data, not thin type imports — emath_ir::Goal (6 sites: plan/
# agent json rendering), Provenance, FallbackPolicy, EvidenceLevel. The
# stale census premise (2 thin types) no longer holds; aliasing Goal onto
# another crate would relocate ownership, not remove the need. emath-ir is
# the true owner.
emath-ir = { workspace = true }
emath-plan = { workspace = true }
emath-portfolio = { workspace = true }
emath-provider-api = { workspace = true }
emath-rust-backend = { workspace = true }
emath-sema = { workspace = true }
emath-syntax = { workspace = true }
emath-store = { path = "../emath-store" }
emath-world-ir = { workspace = true }

[lints]
workspace = true
