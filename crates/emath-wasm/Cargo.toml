[package]
name = "emath-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
emath-artifact = { workspace = true }
emath-core = { workspace = true }
emath-exec-ir = { workspace = true }
emath-genesis = { workspace = true }
emath-ir = { workspace = true }
emath-rust-backend = { workspace = true }
emath-sema = { workspace = true }
emath-syntax = { workspace = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
