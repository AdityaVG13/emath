[package]
name = "emath-tui"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
emath-core = { workspace = true }
emath-syntax = { workspace = true }
emath-sema = { workspace = true }
emath-exec-ir = { workspace = true }
# Native epoch export (emath-8k3zw): emits and compiles the artifact
# crate and its epoch-host sibling. emath-build is std-light
# (emath-artifact + emath-core) for the timed cargo runner; the
# backend carries the shared constructor-crate emitter. No cycles.
emath-build = { workspace = true }
emath-rust-backend = { workspace = true }
# Experiment host (emath experiment): manifest and audit-ledger JSON.
emath-artifact = { workspace = true }
# `emath dream` terminal presenter (SPEC §13): FrankenTUI owns the
# terminal; the dashboard's pure render path does not need it.
ftui = { version = "0.7", optional = true }

[features]
dashboard = ["dep:ftui"]

[lints]
workspace = true
