# emath CI: lint / test / validate on push and pull_request.
#
# Landmark split (mock-free honesty):
#   - lint      fmt + clippy (no cargo test here)
#   - test      cargo test --workspace exactly once (includes tests/emath-* members)
#   - validate  scripts/validate.sh: artifact determinism, negative controls,
#               capstones (cross-path identity, host-path leak, tamper via
#               cache-policy + semantic-genesis demos). validate.sh does NOT
#               re-run fmt/test/clippy, so a PR cannot go green solely because
#               \`cargo test\` compiled nothing.
# \`--verify\` refuses generated crates with no \`#[test]\` tests (E-TLT-012).
#
# Rust channel is pinned by the repository toolchain file
# (rust-toolchain.toml: stable, profile minimal, rustfmt + clippy).
# Cargo caching is built into actions-rust-lang/setup-rust-toolchain@v1.

name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt / clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: workspace tests (incl. tests/emath-*)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run workspace tests
        run: cargo test --workspace

  validate:
    name: artifact / negative-control / capstone gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run repository validation gate
        run: bash scripts/validate.sh
