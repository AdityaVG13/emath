<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="emath: write known math, invent new math, run both">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="150" font-size="96" font-weight="700" fill="url(#accent)">emath</text>
    <text x="76" y="200" font-size="24" fill="#cbd5e1">Write known math. Invent new math. Run both.</text>
    <text x="76" y="250" font-size="17" fill="#64748b">exact by default · every method is a definition</text>
    <text x="76" y="278" font-size="17" fill="#64748b">one question, every carrier</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <rect x="760" y="70" width="380" height="220" rx="12" fill="#0f172a" stroke="#334155"/>
    <circle cx="784" cy="92" r="5" fill="#f87171"/>
    <circle cx="802" cy="92" r="5" fill="#fbbf24"/>
    <circle cx="820" cy="92" r="5" fill="#34d399"/>
    <text x="784" y="132" fill="#94a3b8">x / 3 * 3 - x   at x = 1/10</text>
    <text x="784" y="170" fill="#e2e8f0">exact</text><text x="900" y="170" fill="#34d399">0</text>
    <text x="784" y="198" fill="#e2e8f0">float64</text><text x="900" y="198" fill="#34d399">0</text>
    <text x="784" y="226" fill="#e2e8f0">float32</text><text x="900" y="226" fill="#fbbf24">7.45e-9</text>
    <text x="784" y="254" fill="#e2e8f0">bfloat16</text><text x="900" y="254" fill="#f87171">4.88e-4</text>
    <text x="784" y="278" font-size="14" fill="#64748b">verdict: disagree</text>
  </g>
</svg>
