[package]
name = "emath-calibration-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone package (own lockfile): opt out of the repository workspace so
# `cargo test` works from this directory.
[workspace]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

[dependencies]
emath-term = { path = "../../crates/emath-term" }
emath-ir = { path = "../../crates/emath-ir" }
emath-lab-core = { path = "../../crates/emath-lab-core" }

# Dual seal (ra96/U010): inherit the workspace lint set, including
# forbid(unsafe_code), over the test package.
[lints]
workspace = true
